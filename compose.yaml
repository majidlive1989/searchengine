services:
  atlas:
    build: .
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/copilot.db
      FRONTEND_DIST: /app/frontend/dist
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - atlas-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  atlas-data:
